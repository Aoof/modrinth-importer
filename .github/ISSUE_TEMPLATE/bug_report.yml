name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: "What happened?", description: "Include what you expected instead." }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Version }
  - type: dropdown
    id: source
    attributes:
      label: Pack source
      options: [CurseForge, Prism / MultiMC, ATLauncher, FTB, Technic, packwiz, mods folder, Publishing]
  - type: textarea
    id: logs
    attributes:
      label: Output
      description: Paste the command output or error message.
      render: shell
  - type: markdown
    attributes:
      value: |
        **Attach a debug log if you can.** CLI: rerun with `--debug-log` or run `mrimport doctor`. App: Settings → Diagnostics → Save debug log. It never contains your keys. See [Troubleshooting](https://github.com/Aoof/modrinth-importer/blob/master/docs/troubleshooting.md).

name: Release

# Every push to master publishes a release. The version is derived from
# Conventional Commits since the previous tag:
#   BREAKING CHANGE / "type!:"  -> minor while 0.x (major once >= 1.0)
#   feat                        -> minor
#   anything else               -> patch
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      skip: ${{ steps.v.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: v
        run: bash scripts/next-version.sh >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.skip != 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-latest,     target: aarch64-apple-darwin,      gui: macos-aarch64,   bundle: dmg }
          - { os: macos-latest,     target: x86_64-apple-darwin,       gui: macos-x64,       bundle: dmg }
          - { os: ubuntu-24.04,     target: x86_64-unknown-linux-gnu,  gui: linux-x64,       bundle: appimage }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, gui: linux-aarch64,   bundle: appimage }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    gui: windows-x64,     bundle: nsis }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
        with: { key: "${{ matrix.target }}" }
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: ui/pnpm-lock.yaml }
      - name: Stamp version
        shell: bash
        run: |
          V="${{ needs.version.outputs.version }}"
          sed -i.bak "0,/^version = \".*\"/s//version = \"$V\"/" Cargo.toml
          sed -i.bak "s/\"version\": \".*\"/\"version\": \"$V\"/" src-tauri/tauri.conf.json
          rm -f Cargo.toml.bak src-tauri/tauri.conf.json.bak
      - name: Build CLI
        run: cargo build --release -p mrimport-cli --target ${{ matrix.target }}
      - name: Build desktop app
        run: |
          cargo install tauri-cli --locked
          cargo tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
      - name: Collect assets
        shell: bash
        run: |
          mkdir out
          T=${{ matrix.target }}
          if [ "${{ runner.os }}" = Windows ]; then
            cp target/$T/release/mrimport.exe out/mrimport-$T.exe
            cp target/$T/release/bundle/nsis/*-setup.exe out/ModrinthImporter-${{ matrix.gui }}-setup.exe
          else
            cp target/$T/release/mrimport out/mrimport-$T
            B=target/$T/release/bundle
            case "${{ matrix.bundle }}" in
              dmg) cp $B/dmg/*.dmg out/ModrinthImporter-${{ matrix.gui }}.dmg ;;
              appimage) cp $B/appimage/*.AppImage out/ModrinthImporter-${{ matrix.gui }}.AppImage ;;
            esac
          fi
          ls -l out
      - uses: actions/upload-artifact@v7
        with:
          name: assets-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { path: dist, pattern: "assets-*", merge-multiple: true }
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ needs.version.outputs.version }}"
          gh release create "v$V" dist/* --target "$GITHUB_SHA" --title "v$V" --generate-notes

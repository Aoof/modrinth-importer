[package]
name = "modrinth-importer"
description = "Desktop app for Modrinth Importer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
build = "build.rs"

[lib]
name = "modrinth_importer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
mrimport-core = { path = "../crates/core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.7", features = [] }
tauri-plugin-dialog = "2.8.4"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
